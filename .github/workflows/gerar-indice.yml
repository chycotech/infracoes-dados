name: Gerar índice de pesquisa

# Corre sempre que um ficheiro JSON for alterado no repositório,
# e também à mão, pelo botão "Run workflow" no separador Actions.
on:
  push:
    paths:
      - 'dados/*.json'
      - 'gerar_indice.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar o índice
        run: python gerar_indice.py dados

      - name: Guardar o índice, se tiver mudado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/indice.json dados/versao-dados.json
          if git diff --staged --quiet; then
            echo "O índice já estava atualizado."
          else
            git commit -m "Atualizar índice de pesquisa e carimbo dos dados"
            git push
          fi
